name: iOS Sideload Artifact

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iPhone Sideload Artifact
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          mkdir -p build-logs
          xcodebuild \
            -resolvePackageDependencies \
            -project MuzakKitApp.xcodeproj \
            -scheme MuzakKitApp \
            2>&1 | tee build-logs/resolve-packages.log

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          mkdir -p build-logs build/sideload

          xcodebuild \
            -project MuzakKitApp.xcodeproj \
            -scheme MuzakKitApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            2>&1 | tee build-logs/iphoneos-build.log

      - name: Package sideload artifacts
        run: |
          APP_PATH="$(find "$PWD/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" -type d | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "No .app was produced by xcodebuild."
            exit 1
          fi

          APP_NAME="$(basename "$APP_PATH")"
          rm -rf build/sideload/Payload
          mkdir -p build/sideload/Payload
          ditto "$APP_PATH" "build/sideload/Payload/$APP_NAME"
          (cd build/sideload && zip -qry "MuzakKitApp-unsigned.ipa" Payload)
          ditto -c -k --keepParent "$APP_PATH" "build/sideload/MuzakKitApp-iphoneos-app.zip"

          {
            echo "App: $APP_NAME"
            echo "Bundle identifier: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
            echo "Version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
            echo "Build: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          } > build/sideload/build-info.txt

          codesign -dv "$APP_PATH" > build/sideload/codesign-check.txt 2>&1 || true

      - name: Upload sideload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-sideload-artifacts
          path: |
            build/sideload/*.ipa
            build/sideload/*.zip
            build/sideload/*.txt
            build-logs/*.log
